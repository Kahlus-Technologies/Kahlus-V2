# The single NSRR mirror (SHHS-1) on Engram, CPU only. 8 streams: sleepdata.org allows about 10 requests at once
# in total (429 above that), and each file costs about 4.7 s before its first byte. MD5-verified and resumable.
#   NSRR_TOKEN=$(cat ~/.nsrr_token) sky launch -c fill-nsrr --down -y --secret NSRR_TOKEN infra/engram/fill/fill_nsrr.yaml
name: fill-nsrr

resources:
  infra: slurm/slinky
  cpus: 4
  memory: 8
  disk_size: 20

workdir: .

secrets:
  NSRR_TOKEN: null

file_mounts:
  ~/.nsrr-ca.pem: ~/.config/nsrr/ca-bundle.pem

run: |
  set -euo pipefail
  umask 077
  mkdir -p /shared/aayu/nsrr && chmod 700 /shared/aayu /shared/aayu/nsrr
  export SSL_CERT_FILE=$HOME/.nsrr-ca.pem
  python3 -u infra/engram/fill/nsrr_mirror.py --root /shared/aayu/nsrr --dataset shhs \
    --folder polysomnography/annotations-events-nsrr/shhs1 --folder polysomnography/edfs/shhs1 --conc 8
